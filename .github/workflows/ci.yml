name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        astro-version: ['^4', '^5'] # Astro 4 and 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the integration (if necessary)
        run: npm run build

      - name: Install test project dependencies with Astro ${{ matrix.astro-version }}
        working-directory: tests
        run: |
          npm install astro@${{ matrix.astro-version }}
          npm install

      - name: Run tests with Astro ${{ matrix.astro-version }}
        run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (skip if version already published)
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view astro-broken-links-checker@"$PACKAGE_VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION already published, skipping."
          else
            npm publish --provenance --access public
          fi
